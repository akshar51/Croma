<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Croma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black py-3">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3 me-5" href="#"><img src="./img/Croma_Logo_acrkvn.svg" alt=""></a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
      <div class="d-flex align-items-center w-100">
        <button class="btn text-white me-3 fs-5"><i class="bi bi-list me-1"></i>Menu</button>

        <form class="d-flex flex-grow-1 mx-3" role="search">
          <input class="form-control me-2 search-input" type="search" placeholder="What are you looking for ?" aria-label="Search">
          <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
        </form>

        <div class="d-flex align-items-center">
          <span class="text-white me-3"><i class="bi bi-geo-alt-fill"></i> Mumbai, 400049</span>
          <i class="bi bi-person-fill text-white fs-4 me-3"></i>
          <i class="bi bi-cart-fill text-white fs-4"></i>
        </div>
      </div>
    </div>
  </div>
</nav>
<!-- Slider -->
<!-- Carousel / Slider -->
<div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
  
      <div class="carousel-item active">
        <img src="./img/img-1.webp" class="d-block w-100"  alt="Slide 1">
      </div>
  
      <div class="carousel-item">
        <img src="./img/img-2.webp" class="d-block w-100"  alt="Slide 2">
      </div>
  
      <div class="carousel-item">
        <img src="./img/img-3.webp" class="d-block w-100"  alt="Slide 3">
      </div>
    </div>
  
    <!-- Previous & Next buttons -->
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
  
  <!-- Category Slider -->
<div class="container my-5">
    <div id="categoryCarousel" class="carousel slide" data-bs-ride="carousel">
      
      <div class="carousel-inner">
        <div class="carousel-item active">
          <div class="d-flex justify-content-center gap-3">
            <div class="category-card text-center">
              <img src="./img/washing-machine.webp" class="category-icon" alt="Washing Machines8">
            </div>
            <div class="category-card text-center">
              <img src="./img/tablet.webp" class="category-icon" alt="Tablets">
            </div>
            <div class="category-card text-center">
              <img src="./img/watch.webp" class="category-icon" alt="Wearables">
            </div>
            <div class="category-card text-center">
              <img src="./img/kitchen.webp" class="category-icon" alt="Kitchen Appliances">
             </div>
            <div class="category-card text-center">
              <img src="./img/theatre.webp" class="category-icon" alt="Home Theatres">
            </div>
          </div>
        </div>
  
        <div class="carousel-item">
          <div class="d-flex justify-content-center gap-3">
            <div class="category-card text-center">
              <img src="./icons/hairdryer.svg" class="category-icon" alt="Grooming">
             </div>
            <div class="category-card text-center">
              <img src="./icons/microwave.svg" class="category-icon" alt="Microwaves">
            </div>
            <div class="category-card text-center">
              <img src="./icons/speaker.svg" class="category-icon" alt="Speakers">
            </div>
            <div class="category-card text-center">
              <img src="./icons/camera.svg" class="category-icon" alt="Cameras">
           </div>
            <div class="category-card text-center">
              <img src="./icons/fan.svg" class="category-icon" alt="Fans">
            </div>
          </div>
        </div>
  
      </div>
  
      <button class="carousel-control-prev" type="button" data-bs-target="#categoryCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#categoryCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
  
    </div>
  </div>
  

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
