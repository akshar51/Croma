<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Croma</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black py-3">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3 me-5" href="#"><img src="./img/Croma_Logo_acrkvn.svg" alt="Croma Logo"></a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
      <div class="d-flex align-items-center w-100">
        <button class="btn text-white me-3 fs-5"><i class="bi bi-list me-1"></i>Menu</button>

        <form class="d-flex flex-grow-1 mx-3" role="search">
          <input class="form-control me-2 search-input" type="search" placeholder="What are you looking for ?" aria-label="Search">
          <button class="btn btn-outline-light" type="submit"><i class="bi bi-search"></i></button>
        </form>

        <div class="d-flex align-items-center">
          <span class="text-white me-3"><i class="bi bi-geo-alt-fill"></i> Mumbai, 400049</span>
          <i class="bi bi-person-fill text-white fs-4 me-3"></i>
          <i class="bi bi-cart-fill text-white fs-4"></i>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Main Carousel -->
<div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="./img/img-1.webp" class="d-block w-100" alt="Slide 1">
    </div>
    <div class="carousel-item">
      <img src="./img/img-2.webp" class="d-block w-100" alt="Slide 2">
    </div>
    <div class="carousel-item">
      <img src="./img/img-3.webp" class="d-block w-100" alt="Slide 3">
    </div>
  </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

<div class="container my-5">
  <div class="position-relative">
    <!-- Left Navigation Button -->
    <button class="btn btn-dark position-absolute top-50 start-0 translate-middle-y z-1" id="prevBtn">
      <i class="bi bi-chevron-left"></i>
    </button>

    <!-- Scrollable Category Cards -->
    <div class="d-flex overflow-auto flex-nowrap gap-3 px-5" id="categoryScroll">
      <div class="category-card text-center active">
        <img src="./img/washing-machine.webp" class="category-icon mb-2" alt="Washing machine">
      </div>
      <div class="category-card text-center">
        <img src="./img/tablet.webp" class="category-icon mb-2" alt="Tablet">
      </div>
      <div class="category-card text-center">
        <img src="./img/watch.webp" class="category-icon mb-2" alt="Watch">
      </div>
      <div class="category-card text-center">
        <img src="./img/theatre.webp" class="category-icon mb-2" alt="Speaker">
      </div>
      <div class="category-card text-center">
        <img src="./img/kitchen.webp" class="category-icon mb-2" alt="Kitchen">
      </div>
      <div class="category-card text-center">
        <img src="./img/AC.webp" class="category-icon mb-2" alt="AC">
      </div>
      <div class="category-card text-center">
        <img src="./img/Camera.webp" class="category-icon mb-2" alt="Camera">
      </div>
      <div class="category-card text-center">
        <img src="./img/laptop.webp" class="category-icon mb-2" alt="laptop">
      </div>
      <div class="category-card text-center">
        <img src="./img/Cooler.webp" class="category-icon mb-2" alt="Cooler">
      </div>
      <div class="category-card text-center">
        <img src="./img/Fan.webp" class="category-icon mb-2" alt="Fan">
      </div>
      <div class="category-card text-center">
        <img src="./img/Tv.webp" class="category-icon mb-2" alt="TV">
      </div>
    </div>

    <!-- Right Navigation Button -->
    <button class="btn btn-dark position-absolute top-50 end-0 translate-middle-y z-1" id="nextBtn">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>


<div class="container py-5">
  <h2 class="text-white mb-5">Top Selling Category</h2>
  
  <div class="row g-4">

    <!-- Audio Devices -->
    <div class="col-md-6 col-lg-3">
      <div class="card top-selling-card">
        <img src="./img/Audio-1.png" alt="Audio Devices" class="top-selling-img">
      </div>
    </div>

    <!-- 5G Smartphones -->
    <div class="col-md-6 col-lg-3">
      <div class="card top-selling-card">
        <img src="./img/Audio-2.png" alt="5G Smartphones" class="top-selling-img">
      </div>
    </div>

    <!-- Laptops -->
    <div class="col-md-6 col-lg-3">
      <div class="card top-selling-card">
        <img src="./img/Audio-3.png" alt="Laptops" class="top-selling-img">
      </div>
    </div>

    <!-- Kitchen Appliances -->
    <div class="col-md-6 col-lg-3">
      <div class="card top-selling-card">
        <img src="./img/Audio-4.png" alt="Kitchen Appliances" class="top-selling-img">
      </div>
    </div>
  </div>
</div>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
